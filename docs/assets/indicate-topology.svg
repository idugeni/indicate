<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="topology-title topology-desc">
  <title id="topology-title">Indicate shared deployment topology</title>
  <desc id="topology-desc">Readers, CMS users, API clients, and Telegram webhooks pass through Cloudflare authoritative DNS, proxy TLS, and CDN to one Next.js application in one Vercel project. The application uses one Supabase PostgreSQL and Auth project, one private Cloudflare R2 bucket, and one Upstash Redis resource.</desc>
  <defs>
    <linearGradient id="topology-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102F3C"/>
    </linearGradient>
    <linearGradient id="topology-cf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A3412"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="topology-app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#155E75"/>
    </linearGradient>
    <filter id="topology-shadow" x="-20%" y="-25%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
    <marker id="topology-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#67E8F9"/>
    </marker>
  </defs>

  <rect width="1200" height="740" rx="28" fill="url(#topology-bg)"/>
  <circle cx="1070" cy="70" r="170" fill="#38BDF8" opacity="0.05"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="46" y="54" fill="#F8FAFC" font-size="32" font-weight="750">One shared topology</text>
    <text x="46" y="84" fill="#B7CEDA" font-size="18">Every tenant and exact hostname stays inside the same controlled resource boundary.</text>
    <rect x="918" y="36" width="236" height="46" rx="23" fill="#10334A" stroke="#38BDF8"/>
    <circle cx="944" cy="59" r="7" fill="#5EEAD4"/>
    <text x="962" y="65" fill="#E0F2FE" font-size="16" font-weight="750">SINGLETON RESOURCES</text>

    <text x="48" y="134" fill="#7DD3FC" font-size="16" font-weight="750" letter-spacing="1.5">ENTRY POINTS</text>
    <g filter="url(#topology-shadow)">
      <rect x="46" y="154" width="190" height="68" rx="16" fill="#102A43" stroke="#42677E"/>
      <circle cx="76" cy="188" r="15" fill="#1E4965"/>
      <path d="M68 190c2-11 14-11 16 0M76 180a5 5 0 1 0 0-10 5 5 0 0 0 0 10" fill="none" stroke="#BAE6FD" stroke-width="2.2"/>
      <text x="104" y="195" fill="#F1F5F9" font-size="19" font-weight="700">Readers</text>

      <rect x="46" y="234" width="190" height="68" rx="16" fill="#102A43" stroke="#42677E"/>
      <circle cx="76" cy="268" r="15" fill="#164E63"/>
      <rect x="68" y="258" width="16" height="20" rx="2" fill="none" stroke="#A5F3FC" stroke-width="2.2"/>
      <text x="104" y="275" fill="#F1F5F9" font-size="19" font-weight="700">Central CMS</text>

      <rect x="46" y="314" width="190" height="68" rx="16" fill="#102A43" stroke="#42677E"/>
      <circle cx="76" cy="348" r="15" fill="#312E81"/>
      <path d="M68 348h16m-12-7-7 7 7 7m8-14 7 7-7 7" fill="none" stroke="#C7D2FE" stroke-width="2.2"/>
      <text x="104" y="355" fill="#F1F5F9" font-size="19" font-weight="700">API clients</text>

      <rect x="46" y="394" width="190" height="68" rx="16" fill="#102A43" stroke="#42677E"/>
      <circle cx="76" cy="428" r="15" fill="#075985"/>
      <path d="M65 425l22-9-8 24-4-9z" fill="none" stroke="#BAE6FD" stroke-width="2.2"/>
      <text x="104" y="435" fill="#F1F5F9" font-size="19" font-weight="700">Telegram</text>
    </g>

    <path d="M236 188H268V308H292" fill="none" stroke="#67E8F9" stroke-width="2.5" marker-end="url(#topology-arrow)"/>
    <path d="M236 268H268" fill="none" stroke="#67E8F9" stroke-width="2.5"/>
    <path d="M236 348H268" fill="none" stroke="#67E8F9" stroke-width="2.5"/>
    <path d="M236 428H268V308" fill="none" stroke="#67E8F9" stroke-width="2.5"/>

    <g filter="url(#topology-shadow)">
      <rect x="300" y="194" width="220" height="228" rx="24" fill="url(#topology-cf)" stroke="#FDBA74" stroke-width="2"/>
      <rect x="326" y="220" width="58" height="50" rx="14" fill="#7C2D12"/>
      <path d="M338 253c-6-11 6-24 16-15 6-10 20-2 16 9 8 1 9 12 1 14h-32c-6-1-7-7-1-8z" fill="#FFEDD5"/>
      <text x="398" y="243" fill="#FFF7ED" font-size="23" font-weight="750">Cloudflare</text>
      <text x="326" y="296" fill="#FED7AA" font-size="17" font-weight="750">SOLE AUTHORITY</text>
      <line x1="326" y1="314" x2="494" y2="314" stroke="#FDBA74" opacity="0.65"/>
      <text x="326" y="344" fill="#FFF7ED" font-size="16">Nameservers and DNS</text>
      <text x="326" y="370" fill="#FFF7ED" font-size="16">Wildcard and edge TLS</text>
      <text x="326" y="396" fill="#FFF7ED" font-size="16">Proxy and CDN</text>
    </g>

    <path d="M520 308H580" fill="none" stroke="#67E8F9" stroke-width="3" marker-end="url(#topology-arrow)"/>
    <text x="530" y="292" fill="#A5F3FC" font-size="16" font-weight="700">HTTPS</text>

    <g filter="url(#topology-shadow)">
      <rect x="590" y="176" width="280" height="264" rx="24" fill="url(#topology-app)" stroke="#5EEAD4" stroke-width="2"/>
      <rect x="618" y="204" width="60" height="60" rx="16" fill="#0F3F46"/>
      <path d="M632 248v-28l32 28v-28" fill="none" stroke="#CCFBF1" stroke-width="3" stroke-linejoin="round"/>
      <text x="696" y="226" fill="#F0FDFA" font-size="22" font-weight="750">One Next.js app</text>
      <text x="696" y="253" fill="#A7F3D0" font-size="16" font-weight="700">ONE VERCEL PROJECT</text>
      <line x1="618" y1="287" x2="842" y2="287" stroke="#5EEAD4" opacity="0.5"/>
      <text x="618" y="320" fill="#ECFEFF" font-size="17">CMS · APIs · webhooks</text>
      <text x="618" y="350" fill="#ECFEFF" font-size="17">Bounded publication workers</text>
      <text x="618" y="380" fill="#ECFEFF" font-size="17">One public news template</text>
      <rect x="618" y="397" width="224" height="28" rx="9" fill="#0A3840" stroke="#2DD4BF"/>
      <text x="730" y="417" text-anchor="middle" fill="#CCFBF1" font-size="16" font-weight="750">EXACT HOSTS ONLY</text>
    </g>

    <path d="M870 224H928" fill="none" stroke="#67E8F9" stroke-width="2.5" marker-end="url(#topology-arrow)"/>
    <path d="M870 321H928" fill="none" stroke="#67E8F9" stroke-width="2.5" marker-end="url(#topology-arrow)"/>
    <path d="M870 418H928" fill="none" stroke="#67E8F9" stroke-width="2.5" marker-end="url(#topology-arrow)"/>

    <text x="936" y="134" fill="#7DD3FC" font-size="16" font-weight="750" letter-spacing="1.4">SHARED SERVICES</text>
    <g filter="url(#topology-shadow)">
      <rect x="936" y="150" width="218" height="116" rx="18" fill="#172554" stroke="#818CF8"/>
      <path d="M958 180c0-7 34-7 34 0v34c0 7-34 7-34 0zm0 0c0 7 34 7 34 0m-34 12c0 7 34 7 34 0m-34 12c0 7 34 7 34 0" fill="none" stroke="#C7D2FE" stroke-width="2.2"/>
      <text x="1008" y="185" fill="#EEF2FF" font-size="19" font-weight="750">Supabase</text>
      <text x="1008" y="210" fill="#D9DEFF" font-size="16">PostgreSQL + Auth</text>
      <text x="1008" y="235" fill="#B9C2FF" font-size="16">durable authority</text>

      <rect x="936" y="278" width="218" height="116" rx="18" fill="#3B1D0B" stroke="#FB923C"/>
      <path d="M958 309h34v28h-34zm6 0v-8h22v8" fill="none" stroke="#FED7AA" stroke-width="2.2"/>
      <text x="1008" y="315" fill="#FFF7ED" font-size="19" font-weight="750">Cloudflare R2</text>
      <text x="1008" y="340" fill="#FED7AA" font-size="16">one private bucket</text>
      <text x="1008" y="365" fill="#FDBA74" font-size="16">exact-key media</text>

      <rect x="936" y="406" width="218" height="116" rx="18" fill="#3F1028" stroke="#F472B6"/>
      <path d="M958 438c8-14 27-14 34 0-7 14-26 14-34 0zm6 0c4 7 17 7 22 0-5-7-18-7-22 0" fill="none" stroke="#FBCFE8" stroke-width="2.2"/>
      <text x="1008" y="444" fill="#FDF2F8" font-size="19" font-weight="750">Upstash Redis</text>
      <text x="1008" y="469" fill="#FBCFE8" font-size="16">one shared resource</text>
      <text x="1008" y="494" fill="#F9A8D4" font-size="16">coordination only</text>
    </g>

    <g transform="translate(46 576)">
      <rect width="1108" height="112" rx="21" fill="#071A2A" stroke="#315B70"/>
      <rect x="22" y="22" width="296" height="68" rx="15" fill="#3B1D0B" stroke="#FB923C"/>
      <text x="42" y="49" fill="#FFF7ED" font-size="17" font-weight="750">CLOUDFLARE AUTHORITY</text>
      <text x="42" y="74" fill="#FDBA74" font-size="16">DNS · wildcard · TLS · CDN</text>
      <path d="M332 56H376" stroke="#5EEAD4" stroke-width="2.5" marker-end="url(#topology-arrow)"/>
      <rect x="390" y="22" width="300" height="68" rx="15" fill="#0F3F46" stroke="#5EEAD4"/>
      <text x="410" y="49" fill="#F0FDFA" font-size="17" font-weight="750">VERCEL HOSTING</text>
      <text x="410" y="74" fill="#99F6E4" font-size="16">one app · exact associations</text>
      <path d="M704 56H748" stroke="#5EEAD4" stroke-width="2.5" marker-end="url(#topology-arrow)"/>
      <rect x="762" y="22" width="324" height="68" rx="15" fill="#102A43" stroke="#60A5FA"/>
      <text x="782" y="49" fill="#EFF6FF" font-size="17" font-weight="750">ONE SHARED DATA PLANE</text>
      <text x="782" y="74" fill="#BFDBFE" font-size="16">PostgreSQL · private R2 · Redis</text>
    </g>
  </g>
</svg>

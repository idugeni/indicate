<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">Indicate CI preconditions and conditional operational release flow</title>
  <desc id="pipeline-desc">The CI lane has independent quality-gate and live-postgres-contract jobs, while credential-enabled provider contracts are separately enforced by CI or operators. These live contracts are external preconditions, not inputs consumed by release stage seven. In the operational release lane, a successful deterministic gate runs production readiness before the promotion decision. A failed gate skips readiness, writes synthetic quality-gate-failed readiness evidence, and proceeds to a blocking promotion decision.</desc>
  <defs>
    <linearGradient id="pipeline-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#112D3C"/>
    </linearGradient>
    <linearGradient id="pipeline-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15354A"/>
      <stop offset="1" stop-color="#0C2436"/>
    </linearGradient>
    <linearGradient id="pipeline-release" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#155E75"/>
    </linearGradient>
    <filter id="pipeline-shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
    <marker id="pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#5EEAD4"/>
    </marker>
    <marker id="pipeline-violet-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#C4B5FD"/>
    </marker>
    <marker id="pipeline-failure-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#FB923C"/>
    </marker>
  </defs>

  <rect width="1200" height="900" rx="28" fill="url(#pipeline-bg)"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="46" y="54" fill="#F8FAFC" font-size="32" font-weight="750">External preconditions, fail-closed release decisions</text>
    <text x="46" y="84" fill="#B7CEDA" font-size="18">CI and operators enforce live contracts; the release command evaluates only its own gate and readiness artifacts.</text>

    <g>
      <rect x="38" y="112" width="1124" height="380" rx="24" fill="#081D2D" stroke="#3B6479" stroke-width="1.5"/>
      <rect x="58" y="130" width="202" height="40" rx="20" fill="#10334A" stroke="#38BDF8"/>
      <text x="159" y="157" text-anchor="middle" fill="#E0F2FE" font-size="18" font-weight="750">GITHUB ACTIONS · CI</text>
      <text x="282" y="157" fill="#A9C4D3" font-size="17">Sibling jobs run independently and in parallel.</text>

      <text x="64" y="220" fill="#7DD3FC" font-size="20" font-weight="750">quality-gate</text>
      <text x="64" y="246" fill="#B7CEDA" font-size="16">deterministic job</text>
      <g filter="url(#pipeline-shadow)">
        <rect x="220" y="188" width="680" height="112" rx="19" fill="url(#pipeline-card)" stroke="#38BDF8" stroke-width="1.5"/>
        <rect x="238" y="208" width="148" height="72" rx="14" fill="#0B3148" stroke="#38BDF8"/>
        <text x="312" y="237" text-anchor="middle" fill="#F0F9FF" font-size="18" font-weight="750">Validate</text>
        <text x="312" y="263" text-anchor="middle" fill="#BAE6FD" font-size="16">runtime config</text>

        <rect x="402" y="208" width="148" height="72" rx="14" fill="#272554" stroke="#818CF8"/>
        <text x="476" y="237" text-anchor="middle" fill="#F5F3FF" font-size="18" font-weight="750">Typecheck</text>
        <text x="476" y="263" text-anchor="middle" fill="#D8D7ED" font-size="16">and policies</text>

        <rect x="566" y="208" width="148" height="72" rx="14" fill="#103F3B" stroke="#2DD4BF"/>
        <text x="640" y="234" text-anchor="middle" fill="#ECFDF5" font-size="17" font-weight="750">Unit · Property</text>
        <text x="640" y="261" text-anchor="middle" fill="#B8D9D4" font-size="16">Integration</text>

        <rect x="730" y="208" width="152" height="72" rx="14" fill="#4A2710" stroke="#F59E0B"/>
        <text x="806" y="234" text-anchor="middle" fill="#FFFBEB" font-size="17" font-weight="750">Secure build</text>
        <text x="806" y="261" text-anchor="middle" fill="#FDE68A" font-size="16">and Playwright</text>
      </g>

      <text x="64" y="360" fill="#C4B5FD" font-size="20" font-weight="750">live-postgres-contract</text>
      <text x="64" y="386" fill="#B7CEDA" font-size="16">parallel sibling job</text>
      <g filter="url(#pipeline-shadow)">
        <rect x="220" y="330" width="680" height="92" rx="19" fill="#211B48" stroke="#A78BFA" stroke-width="1.5"/>
        <path d="M252 354c0-8 42-8 42 0v34c0 8-42 8-42 0zm0 0c0 8 42 8 42 0m-42 12c0 8 42 8 42 0m-42 12c0 8 42 8 42 0" fill="none" stroke="#DDD6FE" stroke-width="2.5"/>
        <text x="320" y="365" fill="#F5F3FF" font-size="20" font-weight="750">PostgreSQL 17 live contracts</text>
        <text x="320" y="393" fill="#D8D2E8" font-size="16">Dedicated service database · all stage contract suites</text>
      </g>

      <path d="M900 244H938C952 244 952 284 964 284" fill="none" stroke="#5EEAD4" stroke-width="3" marker-end="url(#pipeline-arrow)"/>
      <path d="M900 376H938C952 376 952 348 964 348" fill="none" stroke="#C4B5FD" stroke-width="3" marker-end="url(#pipeline-violet-arrow)"/>
      <g filter="url(#pipeline-shadow)">
        <rect x="970" y="238" width="166" height="150" rx="21" fill="#103B3F" stroke="#5EEAD4" stroke-width="2"/>
        <circle cx="1053" cy="274" r="18" fill="#134E4A"/>
        <path d="M1044 274l7 7 13-16" fill="none" stroke="#99F6E4" stroke-width="3"/>
        <text x="1053" y="316" text-anchor="middle" fill="#F0FDFA" font-size="19" font-weight="750">Conclusive CI</text>
        <text x="1053" y="344" text-anchor="middle" fill="#B6E4DE" font-size="16">both jobs pass</text>
        <text x="1053" y="369" text-anchor="middle" fill="#B6E4DE" font-size="16">or CI fails</text>
      </g>

      <text x="64" y="452" fill="#A9C4D3" font-size="16">Live PostgreSQL and credential-enabled provider contracts are external CI/operator preconditions.</text>
      <text x="64" y="478" fill="#A9C4D3" font-size="16">The release command neither executes these contracts nor consumes their results as promotion evidence.</text>
    </g>

    <g>
      <rect x="38" y="514" width="1124" height="362" rx="24" fill="#09252B" stroke="#2DD4BF" stroke-width="1.5"/>
      <rect x="58" y="532" width="274" height="40" rx="20" fill="#124943" stroke="#5EEAD4"/>
      <text x="195" y="559" text-anchor="middle" fill="#ECFDF5" font-size="18" font-weight="750">OPERATIONAL RELEASE LANE</text>
      <text x="352" y="559" fill="#B6E4DE" font-size="17">npm run release:release</text>
      <text x="64" y="598" fill="#B7CEDA" font-size="16">Only gate and readiness artifacts from this invocation feed the promotion decision.</text>

      <g filter="url(#pipeline-shadow)">
        <rect x="64" y="625" width="280" height="104" rx="19" fill="url(#pipeline-release)" stroke="#5EEAD4"/>
        <text x="204" y="660" text-anchor="middle" fill="#F0FDFA" font-size="20" font-weight="750">Deterministic gate</text>
        <text x="204" y="690" text-anchor="middle" fill="#CCFBF1" font-size="16">quality and acceptance</text>
        <text x="204" y="714" text-anchor="middle" fill="#CCFBF1" font-size="16">evidence</text>

        <rect x="450" y="605" width="300" height="100" rx="19" fill="#123B4D" stroke="#7DD3FC"/>
        <text x="600" y="637" text-anchor="middle" fill="#F0F9FF" font-size="20" font-weight="750">Production readiness</text>
        <text x="600" y="666" text-anchor="middle" fill="#BAE6FD" font-size="16">gate success only</text>
        <text x="600" y="690" text-anchor="middle" fill="#BAE6FD" font-size="16">read-only live inspection</text>

        <rect x="450" y="725" width="300" height="100" rx="19" fill="#4A2710" stroke="#FB923C"/>
        <text x="600" y="757" text-anchor="middle" fill="#FFF7ED" font-size="20" font-weight="750">Synthetic readiness</text>
        <text x="600" y="786" text-anchor="middle" fill="#FED7AA" font-size="16">gate failure only</text>
        <text x="600" y="810" text-anchor="middle" fill="#FED7AA" font-size="16">quality_gate_failed · no inspection</text>

        <rect x="836" y="665" width="300" height="110" rx="19" fill="#3B1D0B" stroke="#FB923C"/>
        <text x="986" y="699" text-anchor="middle" fill="#FFF7ED" font-size="20" font-weight="750">Promotion decision</text>
        <text x="986" y="728" text-anchor="middle" fill="#FED7AA" font-size="16">always runs after either path</text>
        <text x="986" y="752" text-anchor="middle" fill="#FED7AA" font-size="16">failed evidence blocks promotion</text>
      </g>

      <path d="M344 651H440" fill="none" stroke="#5EEAD4" stroke-width="3" marker-end="url(#pipeline-arrow)"/>
      <text x="392" y="639" text-anchor="middle" fill="#99F6E4" font-size="16">success</text>
      <path d="M344 701H382C404 701 404 775 440 775" fill="none" stroke="#FB923C" stroke-width="3" marker-end="url(#pipeline-failure-arrow)"/>
      <text x="391" y="734" text-anchor="middle" fill="#FED7AA" font-size="16">failure</text>
      <path d="M750 655H790C812 655 812 692 826 692" fill="none" stroke="#5EEAD4" stroke-width="3" marker-end="url(#pipeline-arrow)"/>
      <path d="M750 775H790C812 775 812 748 826 748" fill="none" stroke="#FB923C" stroke-width="3" marker-end="url(#pipeline-failure-arrow)"/>

      <text x="600" y="854" text-anchor="middle" fill="#B7CEDA" font-size="16">A command-level promote result does not attest that external live contract preconditions passed.</text>
    </g>
  </g>
</svg>

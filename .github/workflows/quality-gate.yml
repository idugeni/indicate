name: Release Quality Gate

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  # push:main sengaja menjalankan ulang gate penuh walau SHA sama dengan PR:
  # aggregator quality-gate (+ build Vercel) adalah syarat deployment, dan
  # cancel-in-progress per job mencegah antrean saat push beruntun.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  schedule:
    # Senin 04:00 Asia/Jakarta, setelah dependabot mingguan (03:00),
    # agar bit-rot eksternal ketahuan tanpa menunggu push.
    - cron: '0 21 * * 0'

permissions:
  contents: read

# NOTE: Playwright suites dan skrip policy (policy:*) sengaja di-strip dari
# tree pada 4e72fc3 ("strip test and policy tooling", recoverable dari git
# history). Suite Vitest sudah dikembalikan (`npm test`, `src/**/*.test.ts`)
# dan dijaga gate ini. Job live-postgres-contract dihapus dengan alasan yang
# sama; kembalikan bersamaan dengan suit kontraknya, bukan sebelumnya.
jobs:
  static:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: quality-gate-static-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:bootstrap:check
      - run: npm run typecheck
      - name: audit production dependencies (tahan outage registry singkat)
        run: |
          for i in 1 2 3 4 5; do
            npm run audit:production && break || {
              [ "$i" -eq 5 ] && exit 1
              sleep $((i * 120))
            }
          done

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: quality-gate-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: quality-gate-test-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --shard=${{ matrix.shard }}

  build:
    # Production prerender reads the shared pooled database. Wait for all test
    # shards to finish before opening build-time read pools, avoiding connection
    # exhaustion when the four test jobs and static generation overlap.
    needs: [test]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: quality-gate-build-${{ github.ref }}
      cancel-in-progress: true
    environment: production
    # Build/prerender uses the actual Neon production database. Database URLs
    # and the public Neon Auth endpoint are loaded from Vercel; the cookie secret
    # below is ephemeral for build validation only. Never log credential values.
    env:
      # Schema gate bersenjata di migrasi 197 (migration_gate_events tidak
      # kosong lagi), dan build menegakkannya: initializeContext memanggil
      # assertSchemaGate tanpa phase guard, jadi job ini memverifikasi nyawa
      # terhadap database produksi. Migrasi baru harus diterapkan ke produksi
      # lebih dulu sebelum build ini bisa hijau.
      DASHBOARD_HOST: indicate.website
      API_HOST: api.indicate.website
      WEBHOOK_HOST: webhook.indicate.website
      NEXT_PUBLIC_SITE_URL: https://indicate.website
      DEFAULT_LOCALE: id-ID
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ORIGIN_SECRET: ${{ secrets.CLOUDFLARE_ORIGIN_SECRET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      GENERIC_WEBHOOK_SECRET: ${{ secrets.GENERIC_WEBHOOK_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v6
        with:
          path: .next/cache
          # Kunci stabil per lockfile: actions/cache immutable, jadi kunci
          # per-commit (hash src) membuat entri ~300MB baru tiap push dan
          # menumpuk hingga lewat batas 10 GB. Kunci stabil = hit pakai
          # ulang, hanya lock change yang buat entri baru.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-
      - name: Load verified Neon production configuration
        shell: bash
        run: |
          set -euo pipefail
          api_list_file="$(mktemp)"
          api_list_status="$(curl --silent --show-error --output "$api_list_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${VERCEL_API_TOKEN}" \
            "https://api.vercel.com/v10/projects/prj_GLknFyW3H6b9KBcvbJbwCN2TMcnt/env?teamId=team_HvgOzoFV92X1vjzqQkczC8kK")" || {
              echo "::error::Could not reach the Vercel environment API; check runner network access."
              exit 1
            }"
          if [[ "$api_list_status" != "200" ]]; then
            echo "::error::Vercel environment listing returned HTTP $api_list_status; verify VERCEL_API_TOKEN validity, team access, and project permissions."
            exit 1
          fi
          api_list="$(cat "$api_list_file")"
          rm -f "$api_list_file"
          if ! jq -e '.envs | type == "array"' >/dev/null <<< "$api_list"; then
            echo "::error::Vercel environment API returned an unexpected response schema; refusing to continue."
            exit 1
          fi
          get_env_id() {
            local key="$1"
            local id
            id="$(jq -r --arg key "$key" '[.envs[] | select(.key == $key and (.target | index("production")))] | first | .id // empty' <<< "$api_list")"
            if [[ -z "$id" ]]; then
              echo "::error::Missing production Vercel environment variable: $key"
              return 1
            fi
            printf '%s' "$id"
          }
          get_env_value() {
            local key="$1"
            local id
            id="$(get_env_id "$key")"
            local response_file
            local http_status
            response_file="$(mktemp)"
            http_status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --header "Authorization: Bearer ${VERCEL_API_TOKEN}" \
              "https://api.vercel.com/v1/projects/prj_GLknFyW3H6b9KBcvbJbwCN2TMcnt/env/$id?teamId=team_HvgOzoFV92X1vjzqQkczC8kK&decrypt=true")" || {
                rm -f "$response_file"
                echo "::error::Could not reach the Vercel environment-value API for $key."
                return 1
              }
            if [[ "$http_status" != "200" ]]; then
              rm -f "$response_file"
              echo "::error::Vercel environment-value API returned HTTP $http_status for $key; verify token permissions for decrypted production environment values."
              return 1
            fi
            if ! jq -er '.value // empty' "$response_file"; then
              rm -f "$response_file"
              echo "::error::Vercel returned no decrypted value for $key; verify that the production variable exists and the token can decrypt it."
              return 1
            fi
            rm -f "$response_file"
          }
          pool_url="$(get_env_value CI_DATABASE_POOL_URL)"
          direct_url="$(get_env_value CI_DATABASE_DIRECT_URL)"
          auth_url="$(get_env_value NEON_AUTH_BASE_URL)"
          [[ "$pool_url" == *"@ep-purple-sunset-b3ieqkb7-pooler.c-4.ap-southeast-1.aws.neon.tech/"* ]] || { echo "::error::CI pool URL is not the verified Neon pooler"; exit 1; }
          [[ "$direct_url" == *"@ep-purple-sunset-b3ieqkb7.c-4.ap-southeast-1.aws.neon.tech/"* ]] || { echo "::error::CI direct URL is not the verified Neon endpoint"; exit 1; }
          [[ "$pool_url" =~ ^postgresql://[^:/@]+:[^@]+@ ]] || { echo "::error::CI pool URL must include a non-empty username and password"; exit 1; }
          [[ "$direct_url" =~ ^postgresql://[^:/@]+:[^@]+@ ]] || { echo "::error::CI direct URL must include a non-empty username and password"; exit 1; }
          [[ "$pool_url" == *"indicate_runtime_login:"* ]] || { echo "::error::CI pool URL must use the least-privilege runtime login"; exit 1; }
          [[ "$direct_url" == *"neondb_owner:"* ]] || { echo "::error::CI direct URL must use the migration-only owner login"; exit 1; }
          [[ "$auth_url" == "https://ep-purple-sunset-b3ieqkb7.neonauth.c-4.ap-southeast-1.aws.neon.tech/neondb/auth" ]] || { echo "::error::Neon Auth URL does not match production"; exit 1; }
          printf 'DATABASE_POOL_URL=%s\n' "$pool_url" >> "$GITHUB_ENV"
          printf 'DATABASE_DIRECT_URL=%s\n' "$direct_url" >> "$GITHUB_ENV"
          printf 'NEON_AUTH_BASE_URL=%s\n' "$auth_url" >> "$GITHUB_ENV"
          printf 'NEON_AUTH_COOKIE_SECRET=%s\n' "$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "Loaded Neon production endpoints; credentials are withheld from logs."
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  perf:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: quality-gate-perf-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # `npm run perf` sudah mencakup perf:db-access (lihat package.json);
      # langkah eksplisit kedua dihapus agar budget tidak dipindai dua kali.
      # Hard gate AGENTS.md §"Database access & egress" tetap hidup di dalam
      # `perf`: no unbounded select().from(), whole-set reads hanya menyusut
      # terhadap ratchet scripts/perf/db-access-budget.mjs.
      - run: npm run perf

  docs:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: quality-gate-docs-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint:md
      - run: npm run lint:md:citations
      # Tanpa lychee di sini: docs-gate.yml berjalan setiap ada perubahan
      # **/*.md (termasuk PR campuran kode+md dan jadwal mingguan), sehingga
      # crawl link jaringan yang mahal hanya terjadi sekali per SHA.

  quality-gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: [static, lint, test, perf, build, docs]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.static.result }}" != "success" ] || [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.perf.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.docs.result }}" != "success" ]; then
            echo "gate failed: static=${{ needs.static.result }} lint=${{ needs.lint.result }} test=${{ needs.test.result }} perf=${{ needs.perf.result }} build=${{ needs.build.result }} docs=${{ needs.docs.result }}"
            exit 1
          fi
          echo "gate passed."

name: Release Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Senin 04:00 Asia/Jakarta, setelah dependabot mingguan (03:00),
    # agar bit-rot eksternal ketahuan tanpa menunggu push.
    - cron: '0 21 * * 0'

permissions:
  contents: read

# NOTE: Playwright suites dan skrip policy (policy:*) sengaja di-strip dari
# tree pada 4e72fc3 ("strip test and policy tooling", recoverable dari git
# history). Suite Vitest sudah dikembalikan (`npm test`, `src/**/*.test.ts`)
# dan dijaga gate ini. Job live-postgres-contract dihapus dengan alasan yang
# sama; kembalikan bersamaan dengan suit kontraknya, bukan sebelumnya.
jobs:
  static:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: quality-gate-static-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:bootstrap:check
      - run: npm run typecheck
      - run: npm run audit:production

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: quality-gate-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: quality-gate-test-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8', '8/8']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --shard=${{ matrix.shard }}

  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: quality-gate-build-${{ github.ref }}
      cancel-in-progress: true
    environment: production
    # Build memprerender dengan snapshot runtime asli: butuh kredensial baca.
    # Nilai diisi dari GitHub Secrets (repo settings) — JANGAN tulis literal di sini.
    env:
      # Gate tetap disarmed karena migration_gate_events kosong
      # (standing decision) — build hanya membaca snapshot.
      DASHBOARD_HOST: indicate.web.id
      API_HOST: api.indicate.web.id
      WEBHOOK_HOST: webhook.indicate.web.id
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: https://indicate.web.id
      DEFAULT_LOCALE: id-ID
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      DATABASE_POOL_URL: ${{ secrets.DATABASE_POOL_URL }}
      DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ORIGIN_SECRET: ${{ secrets.CLOUDFLARE_ORIGIN_SECRET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      GENERIC_WEBHOOK_SECRET: ${{ secrets.GENERIC_WEBHOOK_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  quality-gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: [static, lint, test, build]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.static.result }}" != "success" ] || [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ]; then
            echo "gate failed: static=${{ needs.static.result }} lint=${{ needs.lint.result }} test=${{ needs.test.result }} build=${{ needs.build.result }}"
            exit 1
          fi
          echo "gate passed."

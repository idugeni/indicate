name: tmp-apply-site-paging
on:
  push:
    branches: [fix/auto-publish-all-portals]
    paths: ['.github/workflows/tmp-apply-site-paging.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply patch (fails if context differs)
        run: |
          git apply --check .github/tmp-site-paging.patch
          git apply .github/tmp-site-paging.patch
          git diff --stat
          git rm -q -f .github/tmp-site-paging.patch .github/workflows/tmp-apply-site-paging.yml
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: page auto-publish site reads instead of capping at 200'
          git push

name: One-time bootstrap regeneration
on:
  push:
    branches:
      - feat/neon-managed-better-auth
    paths:
      - .github/workflows/repair-bootstrap-once.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/neon-managed-better-auth
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate reviewed bootstrap from migration journal
        run: npm run db:bootstrap
      - name: Commit generated bootstrap if changed
        shell: bash
        run: |
          if git diff --quiet -- src/data/migrations/bootstrap/indicate-schema.sql; then
            echo "Bootstrap already matches the migration source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/migrations/bootstrap/indicate-schema.sql
          git commit -m "chore(db): regenerate bootstrap from reviewed migrations"
          git push origin HEAD:feat/neon-managed-better-auth

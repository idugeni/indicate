name: One-time provider reference audit

on:
  push:
    branches:
      - feat/neon-managed-better-auth
    paths:
      - .github/workflows/supabase-ref-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - name: Report remaining provider references
        shell: bash
        run: |
          set +e
          git grep -inE 'supabase|supavisor' -- src scripts docs .github public package.json .env.example README.md 2>/dev/null | grep -v 'docs/architecture/neon-managed-better-auth-migration.md' | head -600 || true
          echo "END_PROVIDER_REFERENCE_REPORT"
      - name: Remove one-time audit workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/supabase-ref-audit.yml
          git commit -m "chore(ci): remove one-time provider reference audit"
          git push origin "HEAD:${GITHUB_REF_NAME}"

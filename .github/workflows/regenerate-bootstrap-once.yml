name: Regenerate INDICATE bootstrap snapshot (one-shot)

on:
  push:
    branches:
      - fix/platform-access-key-superadmin

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/platform-access-key-superadmin
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:bootstrap
      - name: Commit generated snapshot and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/regenerate-bootstrap-once.yml
          if git diff --quiet; then
            echo "No bootstrap changes were generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/migrations/bootstrap/indicate-schema.sql .github/workflows/regenerate-bootstrap-once.yml
          git commit -m "chore(db): regenerate reviewed bootstrap snapshot"
          git push origin HEAD:fix/platform-access-key-superadmin

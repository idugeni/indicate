name: INDICATE Supabase Backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_DB_URL: ${{ secrets.DATABASE_DIRECT_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate secrets before accessing database
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_DB_URL:-}" ]]; then
            echo "::error::DATABASE_DIRECT_URL secret is empty or unavailable."
            exit 1
          fi
          if [[ -z "${BACKUP_ENCRYPTION_KEY:-}" ]]; then
            echo "::error::Add BACKUP_ENCRYPTION_KEY in repository Actions secrets before running. Use a long random passphrase and save it securely."
            exit 1
          fi

      - name: Dump database roles
        run: supabase db dump --db-url "$SUPABASE_DB_URL" --file roles.sql --role-only

      - name: Dump database schema
        run: supabase db dump --db-url "$SUPABASE_DB_URL" --file schema.sql

      - name: Dump database data
        run: supabase db dump --db-url "$SUPABASE_DB_URL" --file data.sql --data-only

      - name: Package, encrypt, and verify backup
        shell: bash
        run: |
          set -euo pipefail
          test -s roles.sql
          test -s schema.sql
          test -s data.sql
          mkdir -p indicate-supabase-backup
          mv roles.sql schema.sql data.sql indicate-supabase-backup/
          if [[ -d supabase/migrations ]]; then
            cp -R supabase/migrations indicate-supabase-backup/migrations
          fi
          printf 'Project: INDICATE\nGenerated (UTC): %s\nFormat: Supabase CLI logical SQL backup\nManaged schemas such as auth and storage are excluded by the standard dump.\n' "$(date -u +%FT%TZ)" > indicate-supabase-backup/README.txt
          (cd indicate-supabase-backup && sha256sum roles.sql schema.sql data.sql > SHA256SUMS)
          zip -qr indicate-supabase-backup.zip indicate-supabase-backup
          unzip -t indicate-supabase-backup.zip
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -in indicate-supabase-backup.zip -out indicate-supabase-backup.zip.enc -pass env:BACKUP_ENCRYPTION_KEY
          test -s indicate-supabase-backup.zip.enc
          sha256sum indicate-supabase-backup.zip.enc

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: indicate-supabase-backup-encrypted
          path: indicate-supabase-backup.zip.enc
          retention-days: 1
          if-no-files-found: error

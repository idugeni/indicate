name: Execute Neon Auth Production Cutover

on:
  push:
    branches:
      - feat/neon-auth-account-migration-final
    paths:
      - .github/workflows/neon-auth-production-cutover.yml

permissions:
  contents: read

jobs:
  migrate:
    if: github.event.head_commit.message == 'ops: execute production Neon auth cutover'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Load and validate production Neon credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${VERCEL_API_TOKEN:-}" ]] || { echo "::error::VERCEL_API_TOKEN is missing"; exit 1; }
          api_list="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${VERCEL_API_TOKEN}" \
            "https://api.vercel.com/v10/projects/prj_GLknFyW3H6b9KBcvbJbwCN2TMcnt/env?teamId=team_HvgOzoFV92X1vjzqQkczC8kK")"
          get_env_id() {
            jq -er --arg key "$1" '.envs[] | select(.key == $key and (.target | index("production"))) | .id' <<< "$api_list" | head -n1
          }
          get_env_value() {
            local id
            id="$(get_env_id "$1")"
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${VERCEL_API_TOKEN}" \
              "https://api.vercel.com/v1/projects/prj_GLknFyW3H6b9KBcvbJbwCN2TMcnt/env/$id?teamId=team_HvgOzoFV92X1vjzqQkczC8kK" \
              | jq -er '.value'
          }
          database_url="$(get_env_value DATABASE_DIRECT_URL)"
          auth_url="$(get_env_value NEON_AUTH_BASE_URL)"
          [[ "$database_url" == *"@ep-purple-sunset-b3ieqkb7.c-4.ap-southeast-1.aws.neon.tech/"* ]] || { echo "::error::Production DATABASE_DIRECT_URL does not target the Neon Auth production branch"; exit 1; }
          [[ "$database_url" == *"neondb_owner:"* ]] || { echo "::error::Production DATABASE_DIRECT_URL must use the migration-only owner role"; exit 1; }
          [[ "$auth_url" == "https://ep-purple-sunset-b3ieqkb7.neonauth.c-4.ap-southeast-1.aws.neon.tech/neondb/auth" ]] || { echo "::error::NEON_AUTH_BASE_URL does not target the matching production branch"; exit 1; }
          {
            printf 'DATABASE_DIRECT_URL=%s\n' "$database_url"
            printf 'NEON_AUTH_BASE_URL=%s\n' "$auth_url"
          } >> "$GITHUB_ENV"
          echo "Production database and Neon Auth endpoints validated; secret values are not logged."

      - name: Dry-run account migration
        run: node scripts/migrate-legacy-auth-to-neon.mjs

      - name: Apply additive account migration
        run: node scripts/migrate-legacy-auth-to-neon.mjs --apply --confirm-neon-auth-migration

name: Stage 7 Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:providers:stage6
      - run: npm run test:stage7
        env:
          CI: true
          SECRET_SCAN_SENTINEL: stage2-client-secret-sentinel

  live-postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: indicate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d indicate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run live PostgreSQL contracts including Stage 7 runtime readiness
        run: npm run test:postgres:live
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/indicate_test

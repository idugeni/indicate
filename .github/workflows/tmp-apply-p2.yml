name: tmp-apply-p2
on:
  push:
    branches: [fix/bridge-batching-and-paging-tests]
    paths: ['.github/workflows/tmp-apply-p2.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply patch (fails if context differs)
        run: |
          git apply --check .github/tmp-p2.patch
          git apply .github/tmp-p2.patch
          git diff --stat
          git rm -q -f .github/tmp-p2.patch .github/workflows/tmp-apply-p2.yml
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: batch cross-org bridge requests and test site paging'
          git push

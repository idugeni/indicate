name: tmp-remove-site-cap
on:
  push:
    branches: [fix/auto-publish-no-site-cap]
    paths: ['.github/workflows/tmp-remove-site-cap.yml']
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remove limit(200) on apex and city site queries
        run: |
          f=src/data/repos/dashboard.ts
          for n in 1909 1914; do
            sed -n "${n}p" $f | grep -q '\.limit(200);$' || { echo "line $n not as expected"; exit 1; }
            sed -i "${n}s/\.limit(200);\$/;/" $f
          done
          git diff --stat
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git commit -am 'fix: do not cap auto-publish site fan-out at 200'
          git push

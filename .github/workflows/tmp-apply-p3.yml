name: tmp-apply-p3
on:
  push:
    branches: [feat/article-body-rhythm]
    paths: ['.github/workflows/tmp-apply-p3.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply edits (fails closed if anything is not as expected)
        run: |
          python3 - <<'PY'
          import glob
          css = 'src/app/globals.css'
          s = open(css).read()
          anchor = "  .article-grid {\n    display: grid;"
          assert s.count(anchor) == 1, 'css anchor'
          assert 'article-body-rhythm' not in s, 'already applied'
          block = open('.github/tmp-rhythm-block.css').read()
          open(css, 'w').write(s.replace(anchor, block + anchor))
          files = sorted(glob.glob('src/modules/site/components/network/templates/*/pages/article-page.tsx'))
          assert len(files) == 10, len(files)
          old = '<div className="mt-8 space-y-7">\n            <ArticleRichBodyView'
          for f in files:
              t = open(f).read()
              assert t.count(old) == 1, f
              open(f, 'w').write(t.replace(old, '<div className="article-body-rhythm mt-8">\n            <ArticleRichBodyView'))
          PY
          git diff --stat
          git rm -q -f .github/tmp-rhythm-block.css .github/workflows/tmp-apply-p3.yml
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(site): shared article-body-rhythm spacing for all 10 network templates'
          git push

# Dependabot keeps the pinned graph fresh without changing topology.
# package-lock.json remains authoritative; humans still approve every update
# behind a green Release Quality Gate.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    # TypeScript is pinned at v6 deliberately: typescript-eslint hard-throws
    # on TS >= 7 and breaks `npm run lint` (see closed #4). Revisit when the
    # parser supports TS 7; 6.x patches still flow.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels: [ci, dependencies]
    commit-message:
      prefix: ci
      include: scope

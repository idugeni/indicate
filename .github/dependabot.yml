# Dependabot keeps the pinned graph fresh without changing topology.
# package-lock.json remains authoritative; humans still approve every update
# behind a green Release Quality Gate.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels: [dependencies]
    # Default `auto` classifies npm entries as libraries and therefore widens
    # the lockfile only: `^3.1141.0` survives untouched while 3.1142.0 lands in
    # package-lock.json, and an exact pin such as next 16.3.6 degrades into
    # `16.3.6 || 16.3.7`. `increase` rewrites the range to the released version,
    # which is the owner preference and keeps exact pins exact.
    versioning-strategy: increase
    # One PR per minor/patch batch instead of one PR per dependency, so a busy
    # release week cannot exhaust open-pull-requests-limit and strand the rest.
    # Majors stay ungrouped so they get reviewed on their own.
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore
      include: scope
    # TypeScript is pinned at v6 deliberately: typescript-eslint hard-throws
    # on TS >= 7 and breaks `npm run lint` (see closed #4). Revisit when the
    # parser supports TS 7; 6.x patches still flow.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels: [ci, dependencies]
    commit-message:
      prefix: ci
      include: scope
